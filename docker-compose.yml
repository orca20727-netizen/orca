version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # docker compose substitutes these from a .env file in this same
      # directory (copy .env.example -> .env) or from the host shell's
      # environment; the :- defaults below mean it also runs correctly
      # with no .env file present at all. No secrets are baked into the
      # image itself -- everything here is passed in at container start.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_TIMEOUT_SEC=${GROQ_TIMEOUT_SEC:-8}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      # "*" here is fine for local/LAN demo use (no auth/cookies on any
      # endpoint); set FRONTEND_ORIGIN in .env for a real deployment.
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - OPEN_METEO_TIMEOUT=${OPEN_METEO_TIMEOUT:-10}
      - MPA_SAFETY_BUFFER_NM=${MPA_SAFETY_BUFFER_NM:-2.0}
      - LIVE_FEED_REFRESH_SECONDS=${LIVE_FEED_REFRESH_SECONDS:-900}
      - EXTERNAL_FEED_TIMEOUT=${EXTERNAL_FEED_TIMEOUT:-15}
      - ORCA_OCEAN_FEED_URL=${ORCA_OCEAN_FEED_URL:-}
      - ORCA_PFZ_FEED_URL=${ORCA_PFZ_FEED_URL:-}
      - ORCA_VESSEL_FEED_URL=${ORCA_VESSEL_FEED_URL:-}
      - EXTERNAL_FEED_BEARER_TOKEN=${EXTERNAL_FEED_BEARER_TOKEN:-}
      - TELEMETRY_INGEST_TOKEN=${TELEMETRY_INGEST_TOKEN:-}
      - SOURCE_REGISTRY_TIMEOUT=${SOURCE_REGISTRY_TIMEOUT:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
